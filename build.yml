name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project files
        run: |
          P=app/src/main/java/com/pause/app
          mkdir -p $P app/src/main/res/xml
          mv -f AdminReceiver.kt BootReceiver.kt GuardService.kt MainActivity.kt PauseActivity.kt Prefs.kt $P/
          mv -f AndroidManifest.xml app/src/main/
          mv -f device_admin.xml app/src/main/res/xml/
          mv -f app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pause-apk
          path: app/build/outputs/apk/debug/app-debug.apk
